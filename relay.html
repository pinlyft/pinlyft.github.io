<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Pinlyft media relay</title></head>
<body style="font:16px sans-serif;padding:20px">Sending media to Ads Manager…
<script>
(async()=>{const f=new URLSearchParams(location.search).get('f')||'ca_ad_v3.mp4';
const r=await fetch('/assets/media/'+f,{cache:'no-store'});const b=await r.blob();
if(window.opener){window.opener.postMessage({pinlyftMedia:true,name:f,blob:b},'https://adsmanager.facebook.com');document.body.textContent='Sent '+f+' ('+b.size+' bytes). You can close this tab.';}
else document.body.textContent='No opener window.';})();
</script></body></html>
